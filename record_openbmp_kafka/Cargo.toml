[package]
name = "record_openbmp_kafka"
version = "0.1.0"
edition = "2021"
description = "RouteViews Kafka BMP recorder (companion tool for bmpwatch)"
license = "MIT"
repository = "https://github.com/downwithbgp/bmpwatch"
publish = false

[dependencies]
bmpwatch = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Sync BaseConsumer + poll() API only; the default "tokio" feature pulls the
# async runtime for the StreamConsumer API this tool never uses.
rdkafka = { version = "0.36", default-features = false, features = ["libz"] }
serde_json = "1"
ctrlc = "3"
