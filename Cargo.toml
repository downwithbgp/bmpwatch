[workspace]
members = [".", "record_openbmp_kafka"]

[package]
name = "bmpwatch"
version = "0.1.1"
edition = "2021"
description = "Terminal-native RouteViews BMP stream monitor with RPKI validation"
license = "MIT"
repository = "https://github.com/downwithbgp/bmpwatch"
readme = "README.md"
keywords = ["bgp", "bmp", "rpki", "routeviews", "tui"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    ".github/",
    "ARCHITECTURE.md",
    "dist-workspace.toml",
    "docs/*.md",
    "docs/checkpoints/",
    "labs/",
]

[[bin]]
name = "bmpwatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only in-memory BMP/BGP parsing is used (parse_bmp_msg, parse_openbmp_header).
# Disable the default "rustls" feature, which drags in oneio -> reqwest ->
# tokio/hyper for remote-file opening this project never uses.
bgpkit-parser = { version = "0.16", default-features = false, features = ["parser"] }
bytes = "1"
hex = "0.4"
# Sync BaseConsumer + poll() API only; the default "tokio" feature pulls the
# async runtime for the StreamConsumer API this project never uses.
rdkafka = { version = "0.36", default-features = false, features = ["libz"] }
ctrlc = "3"
ratatui = "0.30"
regex = "1"
# Only one HTTPS fetch (RouteViews peering status). Drop the gzip feature:
# without it ureq does not advertise Accept-Encoding, so responses stay plain.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
portable-pty = "0.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
