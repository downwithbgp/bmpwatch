# cargo-deny policy for the bmpwatch workspace.
# Run with: cargo deny check

[licenses]
# All transitive crates must carry one of these permissive licenses.
# SPDX expressions like "MIT OR Apache-2.0" pass when every alternative
# is allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[advisories]
# Vulnerability and unsound advisories always fail (removed config keys).
# `unmaintained = "workspace"`: only fail on unmaintained DIRECT
# dependencies; the unmaintained `serial` crate is transitive and dev-only
# (via portable-pty for the PTY integration tests), so it is a warning.
unmaintained = "workspace"
yanked = "warn"
